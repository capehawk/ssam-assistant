[package]
name = "ssam"
version = "0.14.0"
description = "쌤비서"
authors = ["doguri25"]
edition = "2021"
publish = false

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
tauri = { version = "2.12", features = [] }
tauri-plugin-opener = "2.7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# 자동 업데이트: 새 버전 받기 (Windows 인증서 저장소 사용, 학교 프록시 설정 따름)
reqwest = { version = "0.13", default-features = false, features = ["native-tls", "system-proxy"] }
# 받은 파일의 확인값(SHA-256) 계산
sha2 = "0.10"
# 나이스 자동 붙여넣기: 전역 단축키(Ctrl+V·Esc), 클립보드
tauri-plugin-global-shortcut = "2.4"
# 떠 있는 버튼: 또 켜면 이미 켜진 쌤비서를 앞으로, 컴퓨터를 켜면 버튼 띄우기
tauri-plugin-single-instance = "2"
tauri-plugin-autostart = "2"
arboard = { version = "3.6", default-features = false }

# 나이스 자동 붙여넣기: 키·글자 입력 보내기, 앞에 있는 창과 그 프로그램 확인 (Windows 기본 기능만 씀)
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Threading", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_WindowsAndMessaging"] }
# 쪽지 붙임: 탐색기와 같은 파일 복사(클립보드)·끌어 놓기 (쉘 데이터 개체·OLE 끌기)
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_System_DataExchange", "Win32_System_Memory", "Win32_System_Ole", "Win32_System_SystemServices", "Win32_UI_Shell", "Win32_UI_Shell_Common"] }
# #[implement](끌기 원본) 매크로가 찾는 이름
windows-core = "0.62"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true

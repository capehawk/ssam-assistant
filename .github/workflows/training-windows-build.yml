name: 연수 테스트용 Windows 설치 파일

on:
  push:
    branches: [feature/training-hackathon]
    paths:
      - '.github/workflows/training-windows-build.yml'
  workflow_dispatch:

# 설치 파일 보관만 수행합니다. 릴리즈·태그를 만들 권한은 부여하지 않습니다.
permissions:
  contents: read

concurrency:
  group: training-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - name: 개발 의존성 설치
        run: npm ci
      - name: 연수 배포 파일 생성과 단위 검사
        run: |
          npm run build:training
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run test:training
      - name: Windows 설치 파일 생성
        run: npm run tauri build -- --bundles nsis --config src-tauri/tauri.training.conf.json --features training-demo
      - name: Rust 릴리즈 테스트
        run: cargo test --release --manifest-path src-tauri/Cargo.toml --features training-demo
      - name: WebView2 검사 환경 준비
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $runtime = Get-ChildItem "${env:ProgramFiles(x86)}/Microsoft/EdgeWebView/Application/*/msedgewebview2.exe" -ErrorAction SilentlyContinue
          if (-not $runtime) {
            $installer = Join-Path $env:RUNNER_TEMP 'MicrosoftEdgeWebview2Setup.exe'
            Invoke-WebRequest 'https://go.microsoft.com/fwlink/p/?LinkId=2124703' -OutFile $installer
            $signature = Get-AuthenticodeSignature -LiteralPath $installer
            if ($signature.Status -ne 'Valid' -or $signature.SignerCertificate.Subject -notmatch 'O=Microsoft Corporation') { throw 'WebView2 설치 파일 서명 확인 실패' }
            Start-Process -FilePath $installer -ArgumentList '/silent','/install' -Wait -WindowStyle Hidden
          }
          $runtime = Get-ChildItem "${env:ProgramFiles(x86)}/Microsoft/EdgeWebView/Application/*/msedgewebview2.exe" -ErrorAction Stop | Select-Object -Last 1
          if (-not $runtime) { throw 'WebView2 실행 파일을 찾을 수 없습니다.' }
          "WEBVIEW2_BROWSER_EXECUTABLE_FOLDER=$($runtime.DirectoryName)" >> $env:GITHUB_ENV
          Write-Output "WebView2: $($runtime.VersionInfo.ProductVersion)"
      - name: 실제 Windows 연수 화면 검사
        run: node tests/native/training-smoke.mjs
      - name: 실행 검사 실패 시 진단 파일 보관
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: training-diagnostic-${{ github.run_number }}
          path: |
            src-tauri/target/release/ssam-training.exe
            src-tauri/target/release/bundle/nsis/*.exe
          retention-days: 3
      - name: 테스트 파일과 안내 정리
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $shortSha = $env:GITHUB_SHA.Substring(0, 7)
          $label = "ssam-$version-training-$shortSha"
          New-Item -ItemType Directory -Force out | Out-Null
          $installers = @(Get-ChildItem src-tauri/target/release/bundle/nsis/*.exe)
          if ($installers.Count -ne 1) { throw '설치 파일이 정확히 한 개 있어야 합니다.' }
          Copy-Item -LiteralPath $installers[0].FullName -Destination "out/$label-setup.exe"
          Copy-Item -LiteralPath src-tauri/target/release/ssam-training.exe -Destination "out/$label-portable.exe"
          Get-ChildItem out/*.exe | ForEach-Object {
            "{0}  {1}" -f (Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256).Hash.ToLower(), $_.Name
          } | Set-Content out/SHA256SUMS.txt -Encoding ascii
          @"
          연수 기능 테스트용 쌤비서
          버전: $version / 커밋: $env:GITHUB_SHA
          빌드 기록: https://github.com/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID

          setup.exe는 설치 프로그램, portable.exe는 설치 없이 실행하는 파일입니다.
          앱 이름은 쌤비서 연수 테스트이며 기존 쌤비서와 앱 식별자·저장 공간이 분리됩니다.
          연수 → 내 필수연수에서 배포한 서버 /exec 주소와 교사 시연 인증값을 입력하세요.
          실제 교직원 자료 대신 합성 PDF를 사용하세요. 인증값은 이 파일에 포함하지 않습니다.
          테스트판에서는 공식 자동 업데이트 조회와 설치가 차단됩니다.
          이 결과물은 공식 릴리즈가 아니며 PR 정식 리뷰·병합과 무관합니다.
          "@ | Set-Content out/사용안내.txt -Encoding utf8
      - name: 테스트 설치 파일 보관
        uses: actions/upload-artifact@v6
        with:
          name: ssam-training-windows-${{ github.run_number }}
          path: out/*
          if-no-files-found: error
          retention-days: 14
